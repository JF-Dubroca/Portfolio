version: 2

models:
  - name: stg_sellers
    description: "cleaned sellers table"

    columns:
      - name: seller_id
        description: "Primary key, relationship with order_item"
        data_tests: 
          - unique
          - not_null
      - name: seller_zip_code_prefix
        data_tests: 
          - not_null
      - name: seller_city
      - name: seller_state
