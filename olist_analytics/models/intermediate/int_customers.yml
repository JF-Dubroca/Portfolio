version: 2

models:
  - name: int_customers
    description: "Intermediate customers table enriched"

    columns:
      - name: customer_id
        description: "unique customer ID, primary key"
        data_tests: 
          - unique
          - not_null
      - name: order_number
        data_tests:
          - not_null
      - name: total_spent
        description: "Total revenue generated by the customer, excluding freight value"
        data_tests:
          - not_null
      - name: first_order
        data_tests:
          - not_null
      - name: last_order
        data_tests:
          - not_null
