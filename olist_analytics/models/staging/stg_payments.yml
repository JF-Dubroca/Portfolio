version: 2

models:
  - name: stg_payments
    description: "Cleaned payments table from raw orders_payments "

    data_tests: 
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential

    columns:
      - name: order_id
        description: "orders foreign key"
        data_tests:
          - not_null 
          - relationships:
             arguments:
              - to: ref('stg_orders')
              - field: order_id
      - name: payment_sequential
        data_tests: 
          - not_null
      - name: payment_type
        data_tests: 
          - not_null
          - accepted_values:
              arguments: 
                values: ['debit_card',
                        'credit_card', 
                        'boleto', 
                        'voucher', 
                        'not defined']
      - name: payment_installments
        data_tests:
          - not_null
      - name: payment_value
        data_tests:
          - not_null
