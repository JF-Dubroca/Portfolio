version: 2

models: 
  - name: stg_orders
    description: "Cleaned orders table from raw_orders_dataset"

    columns: 
      - name: order_id
        description: "Primary key"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "customers foreign key"
        data_tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id    
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['shipped', 
                        'processing', 
                        'unavailable',
                        'approved',
                        'delivered',
                        'created', 
                        'invoiced', 
                        'canceled' ]
      - name: order_purchase_timestamp
        data_tests: 
          - not_null
      - name: order_approved_at
      - name: order_delivered_carrier_date
      - name: order_delivered_customer_date
      - name: order_estimated_delivery_date

