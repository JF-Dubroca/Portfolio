version: 2

models: 
  - name: stg_orders_item
    description: "Cleaned orders_item table"

    data_tests: 
      - dbt_utils.unique_combination_of_columns: 
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id 

    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null
      - name: shipping_limit_date
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null
      - name: freight_value
        data_tests:
          - not_null